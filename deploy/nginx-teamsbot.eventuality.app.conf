# /etc/nginx/sites-available/teamsbot.eventuality.app (certbot adds the TLS block)
# Only the Bot Framework endpoint and healthz are public; /api/handoff stays on loopback.
server {
    server_name teamsbot.eventuality.app;
    listen 80;

    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Robots-Tag "noindex, nofollow" always;

    access_log /var/log/nginx/teamsbot_eventuality_app_access.log;
    error_log  /var/log/nginx/teamsbot_eventuality_app_error.log;

    client_max_body_size 20M;

    location = /healthz {
        proxy_pass http://127.0.0.1:3978/healthz;
    }

    location = /api/messages {
        proxy_pass http://127.0.0.1:3978/api/messages;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_connect_timeout 30s;
        proxy_send_timeout 120s;
        proxy_read_timeout 120s;
        proxy_buffering off;
    }

    location / {
        return 404;
    }
}
